[[held_out]]
text = "Sehr geehrte Frau Becker, vielen Dank für Ihre Nachricht. Ich habe die Unterlagen geprüft und würde gerne noch einen Termin für ein kurzes Gespräch vereinbaren."

[[held_out]]
text = "Hallo Herr Weber, anbei sende ich Ihnen den aktualisierten Zeitplan. Bitte lassen Sie mich wissen, ob die Termine für Sie passen, damit wir rechtzeitig planen können."

[[held_out]]
text = "Leider müssen wir das Treffen auf nächste Woche verschieben. Ich bitte um Entschuldigung für die Unannehmlichkeiten und melde mich morgen mit einem neuen Vorschlag."
