[workspace]
resolver = "3"
members = ["crates/core", "crates/infer", "crates/windows", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kunalgoesbyken/nib"

[workspace.dependencies]
nib-core = { path = "crates/core" }
nib-infer = { path = "crates/infer" }
nib-windows = { path = "crates/windows" }
serde = { version = "1", features = ["derive"] }
toml = "1"
unicode-segmentation = "1.13"
crossbeam-channel = "0.5"
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["openmp"] }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
sha2 = "0.11"
directories = "6"
windows = "0.62"
tray-icon = "0.26"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
