[workspace]
resolver = "3"
members = ["crates/core", "crates/infer", "crates/windows", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kunalgoesbyken/pith"

[workspace.dependencies]
pith-core = { path = "crates/core" }
pith-infer = { path = "crates/infer" }
pith-windows = { path = "crates/windows" }
serde = { version = "1", features = ["derive"] }
toml_edit = { version = "0.25", features = ["serde"] }
unicode-segmentation = "1.13"
llama-cpp-2 = { version = "0.1.161", default-features = false }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
sha2 = "0.11"
directories = "6"
windows = "0.62"
windows-numerics = "0.3"
tray-icon = "0.26"
png = "0.18"
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
